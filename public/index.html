<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="The visual archive of Cat with Pepsi Addiction.">
  <title>Pepsi Cat / Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Pepsi Cat Archive home"><span aria-hidden="true"></span>Pepsi Cat <b>/ Archive</b></a>
    <p id="status" role="status" aria-live="polite">Loading photographs…</p>
  </header>
  <main>
    <section id="collage" class="collage" aria-label="Photo posts"></section>
    <section id="empty" class="empty" hidden>
      <h1>No photographs yet.</h1>
      <p>New posts with both text and images will appear here automatically.</p>
    </section>
  </main>
  <template id="post-template">
    <article class="post">
      <div class="media"></div>
      <div class="post-copy">
        <p class="caption"></p>
        <footer>
          <time></time>
          <a class="message-link" target="_blank" rel="noopener noreferrer" aria-label="Open original Discord message">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 0 1.4 1.4l4.2-4.2a3 3 0 1 0-4.2-4.2l-1.7 1.7a1 1 0 0 0 1.4 1.4l1.7-1.7a1 1 0 1 1 1.4 1.4l-4.2 4.2Zm2.8-2.8a1 1 0 0 0-1.4-1.4l-4.2 4.2a3 3 0 0 0 4.2 4.2l1.7-1.7a1 1 0 0 0-1.4-1.4l-1.7 1.7a1 1 0 1 1-1.4-1.4l4.2-4.2Z"/></svg>
          </a>
        </footer>
      </div>
    </article>
  </template>
</body>
</html>
