<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="darkreader-lock">
  <meta name="theme-color" content="#111110">
  <meta name="description" content="The visual archive of Cat with Pepsi Addiction.">
  <link rel="canonical" href="https://pepsicat.photos/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pepsi Cat / Archive">
  <meta property="og:title" content="Pepsi Cat / Archive">
  <meta property="og:description" content="A curated collage of Pepsi Cat's finest moments, preserved from Discord.">
  <meta property="og:url" content="https://pepsicat.photos/">
  <meta property="og:image" content="https://pepsicat.photos/social-card.jpg">
  <meta property="og:image:secure_url" content="https://pepsicat.photos/social-card.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Pepsi Cat visual archive preview">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pepsi Cat / Archive">
  <meta name="twitter:description" content="A curated collage of Pepsi Cat's finest moments, preserved from Discord.">
  <meta name="twitter:image" content="https://pepsicat.photos/social-card.jpg">
  <meta name="twitter:image:alt" content="Pepsi Cat visual archive preview">
  <title>Pepsi Cat / Archive</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand-area">
      <a class="brand" href="/" aria-label="Pepsi Cat home"><img src="/favicon.svg" alt=""><span class="brand-label">Pepsi Cat</span></a>
      <nav class="section-nav" aria-label="Archive sections">
        <a href="/" data-route="archive">/Archive</a>
        <a href="/food" data-route="food">/Food</a>
        <a href="/pets" data-route="pets">/Pets</a>
      </nav>
    </div>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20.7 19.3-4.2-4.2a7 7 0 1 0-1.4 1.4l4.2 4.2a1 1 0 0 0 1.4-1.4ZM5 11a6 6 0 1 1 12 0 6 6 0 0 1-12 0Z"/></svg>
      <label class="visually-hidden" for="post-search">Search posts</label>
      <input id="post-search" type="search" inputmode="search" autocomplete="off" placeholder="Search message ID or title…">
    </div>
    <div class="header-actions">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 17a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1ZM2 12a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1Zm17 0a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1ZM4.2 4.2a1 1 0 0 1 1.4 0L7 5.6A1 1 0 1 1 5.6 7L4.2 5.6a1 1 0 0 1 0-1.4Zm12.4 12.4a1 1 0 0 1 1.4 0l1.4 1.4a1 1 0 0 1-1.4 1.4L16.6 18a1 1 0 0 1 0-1.4Zm2.8-12.4a1 1 0 0 1 0 1.4L18 7a1 1 0 0 1-1.4-1.4L18 4.2a1 1 0 0 1 1.4 0ZM7 16.6A1 1 0 0 1 7 18l-1.4 1.4A1 1 0 0 1 4.2 18l1.4-1.4a1 1 0 0 1 1.4 0Z"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15.3a8 8 0 0 1-10-10 1 1 0 0 0-1.2-1.2A9 9 0 1 0 21.9 16.5a1 1 0 0 0-1.2-1.2ZM12 20a7 7 0 0 1-4-12.7A10 10 0 0 0 16.7 16 7 7 0 0 1 12 20Z"/></svg>
      </button>
      <p id="status" role="status" aria-live="polite">Loading photographs…</p>
    </div>
  </header>
  <main>
    <section id="collage" class="collage" aria-label="Media posts"></section>
    <section id="empty" class="empty" hidden>
      <h1>No photographs yet.</h1>
      <p>New posts with text and visual media will appear here automatically.</p>
    </section>
  </main>
  <footer class="site-footer">
    <p>A fizzy shoutout to <strong>Pepsi Cat / Nikolas</strong>.</p>
    <p class="site-build">Running <a id="build-revision" href="https://github.com/iK4oS/pepsi-bot/commits/main" target="_blank" rel="noopener noreferrer">latest main</a><span id="build-date"></span></p>
  </footer>
  <template id="post-template">
    <article class="post">
      <div class="media"></div>
      <div class="post-copy">
        <p class="caption"></p>
        <footer>
          <time></time>
          <a class="message-link" target="_blank" rel="noopener noreferrer" aria-label="Open original Discord message">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 0 1.4 1.4l4.2-4.2a3 3 0 1 0-4.2-4.2l-1.7 1.7a1 1 0 0 0 1.4 1.4l1.7-1.7a1 1 0 1 1 1.4 1.4l-4.2 4.2Zm2.8-2.8a1 1 0 0 0-1.4-1.4l-4.2 4.2a3 3 0 0 0 4.2 4.2l1.7-1.7a1 1 0 0 0-1.4-1.4l-1.7 1.7a1 1 0 1 1-1.4-1.4l4.2-4.2Z"/></svg>
          </a>
        </footer>
      </div>
    </article>
  </template>
  <dialog id="lightbox" class="lightbox" aria-label="Enlarged photograph">
    <button class="lightbox-close" type="button" aria-label="Close enlarged photograph">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.7 5.3a1 1 0 0 0-1.4 1.4l5.3 5.3-5.3 5.3a1 1 0 0 0 1.4 1.4l5.3-5.3 5.3 5.3a1 1 0 0 0 1.4-1.4L13.4 12l5.3-5.3a1 1 0 0 0-1.4-1.4L12 10.6 6.7 5.3Z"/></svg>
    </button>
    <button class="lightbox-nav lightbox-previous" type="button" aria-label="Previous photograph">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 5.3a1 1 0 0 1 0 1.4L9.4 12l5.3 5.3a1 1 0 0 1-1.4 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0Z"/></svg>
    </button>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next photograph">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 5.3a1 1 0 0 0 0 1.4l5.3 5.3-5.3 5.3a1 1 0 0 0 1.4 1.4l6-6a1 1 0 0 0 0-1.4l-6-6a1 1 0 0 0-1.4 0Z"/></svg>
    </button>
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
  </dialog>
</body>
</html>
