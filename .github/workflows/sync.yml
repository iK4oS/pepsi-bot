name: Sync Discord collage

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: discord-collage-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm test
      - name: Fetch new Discord posts and archive their images
        run: npm run sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: "828022955875368981"
          DISCORD_CHANNEL_ID: "1156474286303891486"
          DISCORD_TARGET_USER_ID: "673196202870833164"
      - name: Commit new content
        run: |
          if git diff --quiet -- public/data public/media; then
            echo "No new content."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/media
          git commit -m "chore(content): sync Discord collage"
          git push
