name: Sync Discord collage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync.yml
      - scripts/**
      - public/*.js
      - test/**
      - package.json
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Rescan the complete backlog across every configured channel"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: discord-collage-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm test
      - name: Verify thumbnail encoder
        run: ffmpeg -version
      - name: Fetch Discord posts with attachment fallbacks
        run: npm run sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: "731881028573986874"
          DISCORD_CHANNEL_ID: "1156474286303891486"
          DISCORD_CHANNEL_IDS: "1156474286303891486,1096355083823890452"
          DISCORD_TARGET_USER_ID: "673196202870833164"
          FULL_SYNC: ${{ github.event_name == 'push' && 'true' || inputs.full_sync || 'false' }}
      - name: Commit new content
        run: |
          if git diff --quiet -- public/data public/media; then
            echo "No new content."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/media
          git commit -m "chore(content): sync Discord collage"
          git push
